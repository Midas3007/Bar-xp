<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Also set as a real response header in firebase.json — a header cannot be
      stripped by injected markup, and this meta tag is the fallback for
      `npm run preview` and any host that does not send it. `img-src` is what
      stops a hand-written profile URL from being fetched by every athlete who
      opens the leaderboard; the rules restrict the same host independently.
      `connect-src` must cover Firestore's websocket transport, which is why
      the wss: origins are listed — omit them and the app looks fine until the
      first write.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://lh3.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://*.cloudfunctions.net wss://*.firebaseio.com wss://*.googleapis.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <meta name="theme-color" content="#f1f4f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07080d" media="(prefers-color-scheme: dark)" />
    <!--
      Runs before the stylesheet so the first paint is already in the right
      theme. The storage key is duplicated from src/lib/theme.ts on purpose:
      this has to execute before any module loads, and an import would defeat
      the point. Falling back to dark on a throw matches what the app looked
      like before it had a light theme.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('barxp.theme');
          var pref = stored === 'light' || stored === 'dark' ? stored : 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <meta
      name="description"
      content="Bar XP — a calisthenics fitness RPG. Log workouts, earn XP, level up, and forge your Strength, Endurance, Aesthetics and Discipline."
    />
    <title>Bar XP — Calisthenics RPG</title>
    <!-- Installable to the home screen; the app is used mostly from a phone. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bar XP" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f1119'/%3E%3Cpath d='M7 12v8M25 12v8M11 10v12M21 10v12M11 16h10' stroke='%2338bdf8' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body class="bg-surface-base text-content antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
