name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Game logic tests
        run: npm run test:game

      - name: Install the Firebase CLI
        run: npm i -g firebase-tools

      # Executes the real rules engine rather than inspecting the rules file.
      - name: Security rules tests
        run: npm run test:rules

      # Proves the application can still write under those rules — a different
      # question from whether each rule works, and the one that breaks when a
      # rule is tightened.
      - name: Write-path check
        run: npm run test:paths
